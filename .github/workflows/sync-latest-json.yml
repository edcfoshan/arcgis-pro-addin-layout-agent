name: sync-latest-json

# 把已发布 Release 里的 latest.json 回写到仓库根,供 jsdelivr @main 镜像使用
# (updater 配置里的第二个 endpoint)。release.yml 出的是草稿 Release,而草稿的
# 资产是下载不到的,所以同步必须等 Release 正式发布后单独触发。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 标签(留空则取 latest)'
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 下载并校验 latest.json
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -n "$TAG" ]; then
            URL="https://github.com/${{ github.repository }}/releases/download/$TAG/latest.json"
          else
            URL="https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
          fi
          echo "GET $URL"
          curl -fsSL -o latest.json "$URL"
          python3 -c "import json;d=json.load(open('latest.json'));assert d.get('version'),d;print('version =',d['version'])"

      - name: 回写并提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          if git diff --cached --quiet; then
            echo "latest.json 无变化,跳过"
            exit 0
          fi
          git commit -m "chore: 同步 updater latest.json"
          git push origin main
