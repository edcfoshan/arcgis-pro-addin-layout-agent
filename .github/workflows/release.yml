name: release
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 生成图标包
        run: |
          cd tools/icon-gen
          npm ci
          node gen-png.mjs

      - name: 安装前端依赖
        run: npm ci
        working-directory: designer-app

      - uses: tauri-apps/tauri-action@v0
        env:
          # GitHub Actions 不会把 GITHUB_TOKEN 自动注入环境,tauri-action 需要它建 Release
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: designer-app
          tagName: ${{ github.ref_name }}
          releaseName: '极思G GISpro 插件设计器 ${{ github.ref_name }}'
          releaseBody: '在应用内「关于 → 检查更新」或直接下载下方 .exe 安装包升级。'
          releaseDraft: true
          prerelease: false

      # latest.json 回写仓库根见 sync-latest-json.yml:草稿 Release 的资产下载不到,
      # 必须等 Release 正式发布后再同步
